<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bertil – Backgammonträning</title>

  <style>
    body {
      margin: 0;
      background: #d3dfd0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #234b3b;
    }

    header {
      background: #234b3b;
      color: white;
      padding: 25px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    main {
      padding: 30px 15px;
    }

    .card {
      background: #f5f7f0;
      max-width: 650px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 12px #0002;
    }

    button {
      background: #75469a;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #593477;
    }
  </style>
</head>

<body>

  <header>
    <h1>BERTIL</h1>
    <p>Din personliga backgammontränare</p>
  </header>

  <main>
    <div class="card">
      <h2>Välkommen till Bertil!</h2>
      <p>
        Här ska du träna på verkliga positioner
        från dina egna backgammonmatcher.
      </p>

      <p>
        Analysera dina beslut, upptäck dina misstag
        och utveckla ditt spel.
      </p>

      <button onclick="startQuiz()">Starta träning</button>

      <p id="message"></p>
    </div>
  </main>

  <script>
    function startQuiz() {
      document.getElementById("message").innerText =
        "Bertil gör sig redo! Snart börjar träningen.";
    }
  </script>

</body>
</html>
